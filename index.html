<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR Master - Final Safety</title>

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; background: transparent; }

        /* STATUS AMPEL */
        #status-bar {
            position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9); color: #ff3333;
            padding: 10px 20px; border-radius: 30px; border: 2px solid #ff3333;
            font-weight: bold; font-size: 16px; z-index: 9999; text-align: center;
            width: 80%;
        }

        /* START SCREEN */
        #start-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 10, 0.98); z-index: 10000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: white;
        }

        button {
            padding: 15px 30px; font-size: 18px; font-weight: bold;
            border: none; border-radius: 50px; cursor: pointer; margin-top: 20px;
        }
        .btn-start { background: #00d2ff; color: black; }
        .btn-cheat { background: #ffaa00; color: black; font-size: 14px; padding: 10px 20px; margin-top: 40px; }

        #error-log { color: red; margin-top: 20px; font-family: monospace; font-size: 12px; }
    </style>
</head>

<body>
    <div id="status-bar">⏳ INITIALISIERE...</div>

    <div id="start-overlay">
        <h1>AR PROTOTYP</h1>
        <div id="error-log">Prüfe Marker-Dateien...</div>

        <button class="btn-start" onclick="startApp()">KAMERA STARTEN</button>

        <button class="btn-cheat" onclick="forceTracking()">⚠️ TRACKING SIMULIEREN</button>
    </div>

    <a-scene
        embedded
        vr-mode-ui="enabled: false;"
        renderer="logarithmicDepthBuffer: true; precision: medium;"
        arjs="sourceType: webcam; debugUIEnabled: false;">

        <a-assets>
            <video id="ki-video" src="assets/video.mp4" preload="auto" loop crossorigin muted playsinline></video>
            <audio id="ki-audio" src="assets/audio.mp3" preload="auto" crossorigin></audio>
        </a-assets>

        <a-nft
            id="nft-entity"
            type="nft"
            url="assets/markers/painting"
            smooth="true" smoothCount="10" smoothTolerance=".01" smoothThreshold="5">

            <a-video
                src="#ki-video"
                width="1.5" height="2.2"
                position="50 0 -100"
                rotation="-90 0 0"
                scale="150 150 150">
            </a-video>
        </a-nft>

        <a-entity camera>
            <a-video id="cheat-video" src="#ki-video" visible="false" position="0 0 -4" width="1.5" height="2.2"></a-video>
        </a-entity>
    </a-scene>

    <script>
        const statusBar = document.getElementById('status-bar');
        const startOverlay = document.getElementById('start-overlay');
        const errorLog = document.getElementById('error-log');
        const video = document.getElementById('ki-video');
        const audio = document.getElementById('ki-audio');
        const cheatVideo = document.getElementById('cheat-video');

        let isTracking = false;

        // --- SCHRITT 1: PRÜFEN OB DATEIEN DA SIND ---
        async function checkFiles() {
            try {
                // Versuche die .fset Datei zu laden
                let response = await fetch('assets/markers/painting.fset');
                if (response.ok) {
                    errorLog.innerHTML = "✅ Marker gefunden. Bereit.";
                    errorLog.style.color = "#00ff00";
                    statusBar.innerText = "🔍 SUCHE BILD...";
                } else {
                    throw new Error("404: 'assets/markers/painting.fset' nicht gefunden!");
                }
            } catch (e) {
                errorLog.innerHTML = "❌ " + e.message + "<br>Checke Groß-/Kleinschreibung!";
                statusBar.innerText = "⚠️ DATEI-FEHLER";
            }
        }
        checkFiles(); // Sofort ausführen

        // --- SCHRITT 2: STARTEN ---
        window.startApp = function() {
            startOverlay.style.display = 'none';
            // Wir starten das Video, ABER ES BLEIBT STUMM (muted=true im HTML)
            video.play().catch(e => console.log("Autoplay prevent"));
        }

        // --- LOGIK: WENN MARKER GEFUNDEN ---
        document.querySelector('a-nft').addEventListener('markerFound', () => {
            console.log("Marker gefunden!");
            isTracking = true;

            // UI Update
            statusBar.innerText = "✅ BILD ERKANNT!";
            statusBar.style.borderColor = "#00ff00";
            statusBar.style.color = "#00ff00";

            // JETZT erst Ton anmachen
            video.muted = false;
            video.play();
            audio.play();
        });

        // --- LOGIK: WENN MARKER VERLOREN ---
        document.querySelector('a-nft').addEventListener('markerLost', () => {
            console.log("Marker verloren!");
            isTracking = false;

            // UI Update
            statusBar.innerText = "🔍 SUCHE BILD...";
            statusBar.style.borderColor = "#ff3333";
            statusBar.style.color = "#ff3333";

            // Sofort stumm und pause
            video.muted = true;
            video.pause();
            audio.pause();
        });

        // --- NOTFALL: TRACKING ERZWINGEN (Button) ---
        window.forceTracking = function() {
            startOverlay.style.display = 'none';
            isTracking = true;

            statusBar.innerText = "⚠️ SIMULATION AKTIV";
            statusBar.style.borderColor = "orange";
            statusBar.style.color = "orange";

            // Fake-Video an der Kamera einschalten
            cheatVideo.setAttribute('visible', 'true');

            // Ton an
            video.muted = false;
            video.play();
            audio.play();
        }

        // Klick auf Screen: Nur laut machen, wenn wir tracken!
        window.addEventListener('click', () => {
            if (isTracking) {
                video.muted = false;
                video.play();
                audio.play();
            }
        });
    </script>
</body>
</html>
