<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR Master - Status Ampel</title>

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }

        /* Status Ampel (Oben Mitte) */
        #status-bar {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8); color: #ff3333;
            padding: 15px 30px; border-radius: 50px; border: 2px solid #ff3333;
            font-weight: bold; font-size: 18px; z-index: 9999; text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* Start Button für Kamera-Zugriff */
        #start-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 10000;
            display: flex; justify-content: center; align-items: center;
        }
        button {
            padding: 20px 40px; font-size: 20px; background: #00d2ff; border: none; border-radius: 10px;
        }
    </style>
</head>

<body>
    <div id="status-bar">🔍 SUCHE MONA LISA...</div>

    <div id="start-overlay">
        <button onclick="startApp()">KAMERA FREIGEBEN</button>
    </div>

    <a-scene
        embedded
        vr-mode-ui="enabled: false;"
        renderer="logarithmicDepthBuffer: true; precision: medium;"
        arjs="sourceType: webcam; debugUIEnabled: false;">

        <a-assets>
            <video id="ki-video" src="assets/video.mp4" preload="auto" loop crossorigin playsinline></video>
            <audio id="ki-audio" src="assets/audio.mp3" preload="auto" crossorigin></audio>
        </a-assets>

        <a-nft
            id="nft-marker"
            type="nft"
            url="assets/markers/painting"
            smooth="true" smoothCount="10" smoothTolerance=".01" smoothThreshold="5">

            <a-plane color="red" width="1.6" height="2.3" position="50 0 -105" rotation="-90 0 0" scale="150 150 150"></a-plane>

            <a-video
                src="#ki-video"
                width="1.5" height="2.2"
                position="50 1 -100"
                rotation="-90 0 0"
                scale="150 150 150">
            </a-video>
        </a-nft>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        const statusBar = document.getElementById('status-bar');
        const startOverlay = document.getElementById('start-overlay');
        const video = document.getElementById('ki-video');
        const audio = document.getElementById('ki-audio');

        let markerFound = false; // Speichert den Status

        // Start-Knopf Logic
        window.startApp = function() {
            startOverlay.style.display = 'none';
            // Video kurz anspielen und pausieren (Browser austricksen)
            video.play().then(() => video.pause());
            audio.play().then(() => audio.pause());
        }

        // --- EVENT LISTENER FÜR DEN MARKER ---

        // 1. Marker erkannt
        document.querySelector('a-nft').addEventListener('markerFound', () => {
            markerFound = true;

            // Ampel auf GRÜN
            statusBar.innerText = "✅ BILD ERKANNT!";
            statusBar.style.color = "#00ff00";
            statusBar.style.borderColor = "#00ff00";
            statusBar.style.background = "rgba(0, 50, 0, 0.9)";

            // Medien starten
            video.play();
            audio.play();
        });

        // 2. Marker verloren
        document.querySelector('a-nft').addEventListener('markerLost', () => {
            markerFound = false;

            // Ampel auf ROT
            statusBar.innerText = "🔍 SUCHE MONA LISA...";
            statusBar.style.color = "#ff3333";
            statusBar.style.borderColor = "#ff3333";
            statusBar.style.background = "rgba(0, 0, 0, 0.8)";

            // Medien stoppen
            video.pause();
            audio.pause();
        });

        // 3. Klick-Interaktion (Nur wenn Marker da ist!)
        window.addEventListener('click', () => {
            if (markerFound) {
                // Wenn Tracking aktiv ist, darf man Ton an/aus schalten
                if (video.paused) {
                    video.play();
                    audio.play();
                }
            } else {
                console.log("Klick ignoriert - Marker nicht sichtbar.");
                // Optional: Ampel kurz blinken lassen
                statusBar.style.transform = "translateX(-50%) scale(1.1)";
                setTimeout(() => statusBar.style.transform = "translateX(-50%) scale(1)", 200);
            }
        });
    </script>
</body>
</html>
