<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Master Prototyp - Korrektur</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

    <style>
        /* Verhindert, dass die Kamera nur in der Ecke klebt */
        body { margin: 0; overflow: hidden; width: 100%; height: 100%; }
        canvas { width: 100% !important; height: 100% !important; margin: 0 !important; }

        .arjs-loader {
            height: 100%; width: 100%; position: absolute; top: 0; left: 0;
            background-color: rgba(0, 0, 0, 0.8); z-index: 9999;
            display: flex; justify-content: center; align-items: center;
            color: white; font-family: sans-serif;
        }

        #ui-overlay {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            z-index: 10; background: rgba(0,0,0,0.6); color: white;
            padding: 15px; border-radius: 20px; font-family: sans-serif;
            text-align: center; display: none; pointer-events: none;
        }
    </style>
</head>

<body style="margin: 0; overflow: hidden;">
    <div class="arjs-loader"><div>Analysiere historische Daten...</div></div>

    <div id="ui-overlay">Mona Lisa erkannt!<br>Tippe auf den Bildschirm für Ton</div>

    <a-scene
        vr-mode-ui="enabled: false;"
        renderer="logarithmicDepthBuffer: true; precision: medium;"
        embedded
        arjs="trackingMethod: nft; sourceType: webcam; debugUIEnabled: false;">

        <a-assets>
            <video id="ki-video" src="assets/video.mp4" preload="auto" loop="true" crossorigin="anonymous" playsinline webkit-playsinline></video>
            <audio id="ki-audio" src="assets/audio.mp3" preload="auto" crossorigin="anonymous"></audio>
        </a-assets>

        <a-nft
            id="nft-marker"
            type="nft"
            url="assets/markers/painting"
            smooth="true" smoothCount="10" smoothTolerance=".01" smoothThreshold="5">

            <a-video src="#ki-video" position="50 0 -50" rotation="-90 0 0" width="100" height="150"></a-video>
        </a-nft>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        const video = document.querySelector('#ki-video');
        const audio = document.querySelector('#ki-audio');
        const loader = document.querySelector('.arjs-loader');
        const overlay = document.querySelector('#ui-overlay');
        const marker = document.querySelector('#nft-marker');

        let isMarkerFound = false;

        // 1. Fix: Loader verschwindet, wenn Marker-DATEIEN im RAM sind
        window.addEventListener('arjs-nft-loaded', () => {
            loader.style.display = 'none';
        });

        // 2. Fix: Audio-Logik nur bei tatsächlichem Scan
        marker.addEventListener('markerFound', () => {
            isMarkerFound = true;
            overlay.style.display = 'block';
        });

        marker.addEventListener('markerLost', () => {
            isMarkerFound = false;
            overlay.style.display = 'none';
            video.pause();
            audio.pause();
        });

        // Klick-Event startet Medien NUR wenn Marker im Bild ist
        window.addEventListener('click', () => {
            if (isMarkerFound) {
                video.muted = false;
                video.play();
                audio.play();
                overlay.innerText = "Interaktion läuft...";
            }
        });
    </script>
</body>
</html>
