<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mona Lisa AR - Final</title>

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

    <style>
        /* Basis Layout */
        body { margin: 0; overflow: hidden; font-family: sans-serif; background: transparent; }

        /* Video im Hintergrund (wichtig für iOS) */
        video { object-fit: cover; }

        /* --- STATUS AMPEL (Oben) --- */
        #status-bar {
            position: fixed; top: 15px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85); color: #ff3333;
            padding: 8px 20px; border-radius: 30px; border: 2px solid #ff3333;
            font-weight: bold; font-size: 14px; letter-spacing: 1px;
            z-index: 9000; text-align: center; white-space: nowrap;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }

        /* --- START SCREEN (Verdeckt alles bis Start) --- */
        #start-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 10, 1.0); z-index: 10000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: white; text-align: center; padding: 20px;
        }

        h1 { margin-bottom: 10px; font-size: 24px; letter-spacing: 2px; color: #00d2ff; }

        /* Buttons */
        button {
            width: 100%; max-width: 280px; padding: 18px;
            font-size: 16px; font-weight: bold; text-transform: uppercase;
            border: none; border-radius: 50px; cursor: pointer; margin-top: 20px;
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.95); }

        .btn-start {
            background: linear-gradient(45deg, #00d2ff, #0099ff);
            color: white;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.4);
        }

        .btn-cheat {
            background: transparent; border: 1px solid #555;
            color: #888; font-size: 12px; margin-top: 60px; padding: 10px;
        }

        #error-log { color: #888; margin-top: 10px; font-family: monospace; font-size: 12px; }
    </style>
</head>

<body>
    <div id="status-bar">⏳ INITIALISIERE...</div>

    <div id="start-overlay">
        <h1>AR EXPERIENCE</h1>
        <div id="error-log">Verbinde mit Server...</div>

        <button class="btn-start" onclick="startApp()">Erlebnis Starten</button>

        <button class="btn-cheat" onclick="forceTracking()">⚠️ DEBUG / DEMO MODE</button>
    </div>

    <a-scene
        embedded
        vr-mode-ui="enabled: false;"
        renderer="logarithmicDepthBuffer: true; precision: medium;"
        arjs="sourceType: webcam; debugUIEnabled: false;">

        <a-assets>
            <video id="ki-video" src="assets/video.mp4" preload="auto" loop crossorigin muted playsinline></video>
            <audio id="ki-audio" src="assets/audio.mp3" preload="auto" crossorigin></audio>
        </a-assets>

        <a-nft
            id="nft-marker"
            type="nft"
            url="https://bastiancurth.github.io/ba-ar-proto/assets/markers/painting"
            smooth="true" smoothCount="10" smoothTolerance=".01" smoothThreshold="5">

            <a-video
                src="#ki-video"
                width="1" height="1.49"
                position="12 0 -48"
                rotation="-90 0 0"
                scale="31 31 31">
            </a-video>
        </a-nft>

        <a-entity camera>
             <a-video id="cheat-video" src="#ki-video" visible="false" position="0 0 -2" width="1" height="1.49"></a-video>
        </a-entity>
    </a-scene>

    <script>
        const statusBar = document.getElementById('status-bar');
        const startOverlay = document.getElementById('start-overlay');
        const errorLog = document.getElementById('error-log');
        const video = document.getElementById('ki-video');
        const audio = document.getElementById('ki-audio');
        const cheatVideo = document.getElementById('cheat-video');

        // --- 1. GITHUB CHECK ---
        fetch("https://bastiancurth.github.io/ba-ar-proto/assets/markers/painting.fset").then(r => {
            if(r.ok) {
                errorLog.innerHTML = "✅ System Bereit";
                errorLog.style.color = "#00ff00";
                statusBar.innerText = "🔍 BEREIT";
            } else {
                errorLog.innerHTML = "❌ Server-Fehler (404)";
                statusBar.innerText = "⚠️ ERROR";
            }
        });

        // --- 2. START APP (STRENGER AUDIO MODE) ---
        window.startApp = function() {
            startOverlay.style.display = 'none';

            // Audio-Context aufwecken, aber sofort stumm schalten
            video.muted = true;
            video.play().then(() => {
                video.pause();         // Sofort Pause
                video.currentTime = 0; // Reset
            }).catch(e => console.log("Audio Init ok"));

            statusBar.innerText = "📷 SCANNE BILD...";
        }

        // --- 3. MARKER GEFUNDEN ---
        document.querySelector('a-nft').addEventListener('markerFound', () => {
            statusBar.innerText = "✅ ERKANNT";
            statusBar.style.borderColor = "#00ff00";
            statusBar.style.color = "#00ff00";
            statusBar.style.backgroundColor = "rgba(0, 50, 0, 0.9)";

            // Audio & Video starten
            video.muted = false;
            video.play();
            audio.play();
        });

        // --- 4. MARKER VERLOREN ---
        document.querySelector('a-nft').addEventListener('markerLost', () => {
            statusBar.innerText = "🔍 Suche Mona Lisa...";
            statusBar.style.borderColor = "#ff3333";
            statusBar.style.color = "#ff3333";
            statusBar.style.backgroundColor = "rgba(0, 0, 0, 0.85)";

            // Sofort stopp
            video.muted = true;
            video.pause();
            audio.pause();
        });

        // --- 5. NOTFALL DEMO ---
        window.forceTracking = function() {
            startOverlay.style.display = 'none';
            statusBar.innerText = "⚠️ DEMO MODUS";
            statusBar.style.borderColor = "orange";
            statusBar.style.color = "orange";

            cheatVideo.setAttribute('visible', 'true');

            video.muted = false;
            video.play();
            audio.play();
        }

        // --- 6. KLICK-FIX ---
        window.addEventListener('click', () => {
            // Wenn grün oder orange -> Abspielen erzwingen falls pausiert
            const statusColor = window.getComputedStyle(statusBar).color;
            if (statusColor === "rgb(0, 255, 0)" || statusBar.innerText.includes("DEMO")) {
                if(video.paused) { video.play(); audio.play(); }
            }
        });
    </script>
</body>
</html>
