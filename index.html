<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR Master - Layout Fix</title>

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

    <style>
        /* Grundlayout */
        body { margin: 0; overflow: hidden; font-family: sans-serif; background: transparent; }
        * { box-sizing: border-box; } /* Wichtig: Verhindert, dass Padding das Layout sprengt */

        /* --- STATUS AMPEL (Kleiner & Oben) --- */
        #status-bar {
            position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9); color: #ff3333;
            padding: 5px 15px; border-radius: 20px; border: 2px solid #ff3333;
            font-weight: bold; font-size: 12px; z-index: 9000; text-align: center;
            white-space: nowrap;
        }

        /* --- KALIBRIERUNGS PANEL (Verbessert) --- */
        #calib-panel {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(0, 0, 0, 0.9); color: #00d2ff;
            padding: 15px;
            border-top: 3px solid #00d2ff;
            z-index: 9999;
            display: flex; flex-direction: column; gap: 8px;
            max-height: 40vh; overflow-y: auto; /* Scrollbar falls zu klein */
        }

        /* Container für jeden Regler */
        .slider-group {
            display: flex; flex-direction: column;
            width: 100%;
        }

        /* Beschriftung */
        label {
            display: flex; justify-content: space-between;
            font-size: 14px; font-weight: bold; color: white; margin-bottom: 5px;
        }

        /* Die Zahl (Wichtig!) */
        .val-disp { color: #00d2ff; font-family: monospace; font-size: 16px; }

        /* Der Slider selbst */
        input[type=range] {
            width: 100%; height: 30px; accent-color: #00d2ff; cursor: pointer;
        }

        /* --- START SCREEN --- */
        #start-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 10, 1.0); z-index: 10000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: white; text-align: center; padding: 20px;
        }

        button {
            padding: 15px 30px; font-size: 18px; font-weight: bold; width: 100%; max-width: 300px;
            border: none; border-radius: 50px; cursor: pointer; margin-top: 15px;
        }
        .btn-start { background: #00d2ff; color: black; box-shadow: 0 0 15px #00d2ff; }
        .btn-cheat { background: #ffaa00; color: black; font-size: 14px; margin-top: 40px; }

        #error-log { color: #888; margin-top: 20px; font-family: monospace; font-size: 12px; }
    </style>
</head>

<body>
    <div id="status-bar">⏳ VERBINDE...</div>

    <div id="start-overlay">
        <h1>KALIBRIERUNG</h1>
        <div id="error-log">Prüfe Server...</div>
        <button class="btn-start" onclick="startApp()">KAMERA STARTEN</button>
        <button class="btn-cheat" onclick="forceTracking()">⚠️ DEMO / NOTFALL</button>
    </div>

    <div id="calib-panel">
        <div style="text-align:center; margin-bottom:5px; color:#aaa; font-size:12px;">Werte notieren!</div>

        <div class="slider-group">
            <label>Größe: <span id="val-s" class="val-disp">150</span></label>
            <input type="range" id="sl-s" min="10" max="400" value="150" oninput="updateAR()">
        </div>

        <div class="slider-group">
            <label>Links/Rechts (X): <span id="val-x" class="val-disp">50</span></label>
            <input type="range" id="sl-x" min="-200" max="400" value="50" oninput="updateAR()">
        </div>

        <div class="slider-group">
            <label>Oben/Unten (Z): <span id="val-z" class="val-disp">-50</span></label>
            <input type="range" id="sl-z" min="-400" max="200" value="-50" oninput="updateAR()">
        </div>
    </div>

    <a-scene
        embedded
        vr-mode-ui="enabled: false;"
        renderer="logarithmicDepthBuffer: true; precision: medium;"
        arjs="sourceType: webcam; debugUIEnabled: false;">

        <a-assets>
            <video id="ki-video" src="assets/video.mp4" preload="auto" loop crossorigin muted playsinline></video>
            <audio id="ki-audio" src="assets/audio.mp3" preload="auto" crossorigin></audio>
        </a-assets>

        <a-nft
            id="nft-marker"
            type="nft"
            url="https://bastiancurth.github.io/ba-ar-proto/assets/markers/painting"
            smooth="true" smoothCount="10" smoothTolerance=".01" smoothThreshold="5">

            <a-video
                id="ar-video"
                src="#ki-video"
                width="1" height="1.49"
                position="50 0 -50"
                rotation="-90 0 0"
                scale="150 150 150">
            </a-video>
        </a-nft>

        <a-entity camera>
             <a-video id="cheat-video" src="#ki-video" visible="false" position="0 0 -4" width="1" height="1.49"></a-video>
        </a-entity>
    </a-scene>

    <script>
        const statusBar = document.getElementById('status-bar');
        const startOverlay = document.getElementById('start-overlay');
        const errorLog = document.getElementById('error-log');
        const video = document.getElementById('ki-video');
        const audio = document.getElementById('ki-audio');
        const cheatVideo = document.getElementById('cheat-video');
        const arVideo = document.getElementById('ar-video');

        // SLIDER REFS
        const slS = document.getElementById('sl-s');
        const slX = document.getElementById('sl-x');
        const slZ = document.getElementById('sl-z');
        const valS = document.getElementById('val-s');
        const valX = document.getElementById('val-x');
        const valZ = document.getElementById('val-z');

        // LIVE UPDATE
        window.updateAR = function() {
            let s = slS.value;
            let x = slX.value;
            let z = slZ.value;
            valS.innerText = s;
            valX.innerText = x;
            valZ.innerText = z;
            arVideo.setAttribute('scale', `${s} ${s} ${s}`);
            arVideo.setAttribute('position', `${x} 0 ${z}`);
        }

        // 1. CHECK FILES
        fetch("https://bastiancurth.github.io/ba-ar-proto/assets/markers/painting.fset").then(r => {
            if(r.ok) {
                errorLog.innerHTML = "✅ GitHub OK";
                errorLog.style.color = "#00ff00";
                statusBar.innerText = "🔍 BEREIT";
            } else {
                errorLog.innerHTML = "❌ 404 Fehler";
            }
        });

        // 2. START APP (STRENGER AUDIO MODE)
        window.startApp = function() {
            startOverlay.style.display = 'none';

            // Audio-Engine aufwecken, aber sofort knebeln
            video.muted = true; // Sicherstellen, dass es stumm ist
            video.play().then(() => {
                video.pause();      // Sofort Pause
                video.currentTime = 0; // Zurückspulen
            }).catch(e => console.log("Audio Init Warning"));
        }

        // 3. MARKER GEFUNDEN (Audio loslassen)
        document.querySelector('a-nft').addEventListener('markerFound', () => {
            statusBar.innerText = "✅ ERKANNT -> SCHIEBEN!";
            statusBar.style.borderColor = "#00ff00";
            statusBar.style.color = "#00ff00";

            // Jetzt darf es tönen
            video.muted = false;
            video.play();
            audio.play();
        });

        // 4. MARKER VERLOREN (Audio stoppen)
        document.querySelector('a-nft').addEventListener('markerLost', () => {
            statusBar.innerText = "🔍 Suche...";
            statusBar.style.borderColor = "#ff3333";
            statusBar.style.color = "#ff3333";

            // Sofort Ruhe
            video.muted = true;
            video.pause();
            audio.pause();
        });

        // 5. NOTFALL DEMO
        window.forceTracking = function() {
            startOverlay.style.display = 'none';
            statusBar.innerText = "⚠️ DEMO MODUS";
            statusBar.style.borderColor = "orange";
            statusBar.style.color = "orange";
            cheatVideo.setAttribute('visible', 'true');
            video.muted = false; video.play(); audio.play();
            alert("Slider gehen nur im echten AR Modus!");
        }

        // Extra Klick-Schutz
        window.addEventListener('click', () => {
            // Nur abspielen, wenn wir wirklich tracken (oder Demo an ist)
            if (statusBar.style.color === "rgb(0, 255, 0)" || statusBar.innerText.includes("DEMO")) {
                if(video.paused) { video.play(); audio.play(); }
            }
        });
    </script>
</body>
</html>
