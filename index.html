<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR Master - Auto Camera</title>

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

    <style>
        /* 1. KAMERA FREILEGEN */
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: transparent !important; /* Kein Schwarz! */
            overflow: hidden; font-family: monospace;
        }

        /* Das Video von AR.js muss ganz nach hinten */
        #arjs-video {
            position: absolute !important; top: 0 !important; left: 0 !important;
            width: 100% !important; height: 100% !important;
            object-fit: cover !important; z-index: -100 !important;
        }

        /* 2. OVERLAY (Verschwindet automatisch) */
        #loader-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9); z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #0f0; transition: opacity 1s; /* Weiches Ausblenden */
        }

        .log-entry { margin: 5px; font-size: 14px; text-align: center; }
        .success { color: #00ff00; font-weight: bold; }
        .error { color: #ff3333; font-weight: bold; }

        /* Kleiner Hinweis unten, wenn Kamera aktiv ist */
        #scan-hint {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.5); color: white; padding: 10px 20px;
            border-radius: 20px; display: none; z-index: 100; pointer-events: none;
        }

        /* Demo Button */
        #demo-btn {
            margin-top: 20px; padding: 10px 20px; background: red; color: white; border: none; font-weight: bold; cursor: pointer; display: none;
        }
    </style>
</head>

<body>
    <div id="loader-screen">
        <h2>System-Start</h2>
        <div id="debug-log">Prüfe Dateien...</div>
        <div class="spinner" style="font-size: 24px; margin-top: 10px;">⏳</div>
        <button id="demo-btn" onclick="forceDemo()">NOTFALL DEMO</button>
    </div>

    <div id="scan-hint">📷 Bitte Mona Lisa scannen</div>

    <a-scene
        embedded
        vr-mode-ui="enabled: false;"
        renderer="logarithmicDepthBuffer: true; precision: medium;"
        arjs="sourceType: webcam; debugUIEnabled: false;">

        <a-assets>
            <video id="ki-video" src="assets/video.mp4" preload="auto" loop crossorigin="anonymous" playsinline webkit-playsinline></video>
            <audio id="ki-audio" src="assets/audio.mp3" preload="auto" crossorigin="anonymous"></audio>
        </a-assets>

        <a-nft
            id="nft-marker"
            type="nft"
            url="assets/markers/painting"
            smooth="true" smoothCount="10" smoothTolerance=".01" smoothThreshold="5">

            <a-video src="#ki-video"
                     width="1.5" height="2.2" position="50 100 -100" rotation="-90 0 0" scale="150 150 150">
            </a-video>
        </a-nft>

        <a-entity camera>
            <a-video id="demo-vid" src="#ki-video" visible="false" position="0 0 -4" width="1.5" height="2.2"></a-video>
        </a-entity>
    </a-scene>

    <script>
        const logContainer = document.getElementById('debug-log');
        const loader = document.getElementById('loader-screen');
        const scanHint = document.getElementById('scan-hint');
        const demoBtn = document.getElementById('demo-btn');
        const video = document.getElementById('ki-video');
        const audio = document.getElementById('ki-audio');

        function log(msg, color='white') {
            logContainer.innerHTML = `<div style="color:${color}">${msg}</div>`;
        }

        // 1. DATEIEN PRÜFEN & KAMERA FREIGEBEN
        async function startSystem() {
            try {
                // Check Marker
                let r1 = await fetch('assets/markers/painting.fset');
                if (!r1.ok) throw new Error("Marker fehlt (404)");

                // Check Video
                let r2 = await fetch('assets/video.mp4');
                if (!r2.ok) throw new Error("Video fehlt (404)");

                log("✅ DATEIEN OK! Kamera startet in 3s...", "#00ff00");

                // WARTE 3 SEKUNDEN, DANN LOADER WEG
                setTimeout(() => {
                    loader.style.opacity = '0'; // Ausblenden
                    setTimeout(() => {
                        loader.style.display = 'none'; // Ganz entfernen
                        scanHint.style.display = 'block'; // Hinweis zeigen
                    }, 1000);
                }, 3000);

            } catch (e) {
                log("❌ FEHLER: " + e.message, "red");
                demoBtn.style.display = "block"; // Demo Button zeigen
            }
        }

        // Sofort starten
        startSystem();

        // 2. AR EVENTS
        document.querySelector('a-nft').addEventListener('markerFound', () => {
            scanHint.innerText = "🟢 Marker erkannt!";
            scanHint.style.backgroundColor = "green";
            video.play();
            audio.play();
        });

        document.querySelector('a-nft').addEventListener('markerLost', () => {
            scanHint.innerText = "📷 Suche Marker...";
            scanHint.style.backgroundColor = "rgba(0,0,0,0.5)";
            video.pause();
            audio.pause();
        });

        // 3. DEMO MODUS (Notfall)
        window.forceDemo = function() {
            loader.style.display = 'none';
            document.getElementById('demo-vid').setAttribute('visible', 'true');
            video.muted = false;
            video.play();
            audio.play();
            alert("Demo läuft!");
        };

        // Audio Unlock
        window.addEventListener('click', () => {
            video.play();
            audio.play();
        });
    </script>
</body>
</html>
