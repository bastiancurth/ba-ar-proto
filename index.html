<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR Master - Simple Video Check</title>

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

    <style>
        /* --- CSS FIX: VOLLBILD & KAMERA --- */
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: transparent !important; /* WICHTIG: Keine schwarze Wand! */
            overflow: hidden; font-family: monospace;
        }

        /* Zwingt das Video in den Hintergrund */
        #arjs-video {
            position: absolute !important; top: 0 !important; left: 0 !important;
            width: 100% !important; height: 100% !important;
            object-fit: cover !important; z-index: -2 !important;
        }

        /* Der 3D Inhalt liegt darüber */
        canvas.a-canvas {
            position: absolute !important; width: 100% !important; height: 100% !important;
            z-index: 1 !important;
        }

        /* --- UI: DEBUG CONSOLE --- */
        #loader-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 10, 0.95); z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            color: #0f0; padding-top: 50px; overflow-y: auto;
        }

        .log-entry { margin: 5px 0; font-size: 12px; width: 90%; text-align: left; border-bottom: 1px solid #333; padding-bottom: 2px; }
        .error { color: #ff3333; font-weight: bold; }
        .success { color: #00ff00; }

        /* Notfall Button */
        #fallback-btn {
            margin-top: 30px; padding: 15px 30px;
            background: #ff4757; color: white; border: none; border-radius: 8px;
            font-size: 16px; font-weight: bold; cursor: pointer;
            display: none;
        }
    </style>
</head>

<body>
    <div id="loader-screen">
        <h3>System-Diagnose (Ohne Shader)</h3>
        <div id="debug-log"></div>
        <button id="fallback-btn" onclick="startDemoMode()">⚠️ DEMO VIDEO ZEIGEN</button>
    </div>

    <a-scene
        embedded
        vr-mode-ui="enabled: false;"
        renderer="logarithmicDepthBuffer: true; precision: medium;"
        arjs="trackingMethod: nft; sourceType: webcam; debugUIEnabled: false; resizeEnabled: true;">

        <a-assets>
            <video id="ki-video" src="assets/video.mp4" preload="auto" loop crossorigin="anonymous" playsinline webkit-playsinline></video>
            <audio id="ki-audio" src="assets/audio.mp3" preload="auto" crossorigin="anonymous"></audio>
        </a-assets>

        <a-nft
            id="nft-marker" type="nft" url="assets/markers/painting"
            smooth="true" smoothCount="10" smoothTolerance=".01" smoothThreshold="5">

            <a-video src="#ki-video"
                     width="1.5" height="2.2" position="50 100 -100" rotation="-90 0 0" scale="150 150 150">
            </a-video>
        </a-nft>

        <a-entity camera position="0 0 0">
            <a-video
                id="demo-video"
                src="#ki-video"
                visible="false"
                position="0 0 -4"
                width="1.5" height="2.2">
            </a-video>
        </a-entity>
    </a-scene>

    <script>
        // --- VARIABLEN ---
        const logContainer = document.getElementById('debug-log');
        const fallbackBtn = document.getElementById('fallback-btn');
        const loaderScreen = document.getElementById('loader-screen');
        const demoVideo = document.getElementById('demo-video');
        const video = document.getElementById('ki-video');
        const audio = document.getElementById('ki-audio');

        // --- 1. DATEI CHECK ---
        function log(msg, type='info') {
            logContainer.innerHTML += `<div class="log-entry ${type}">${msg}</div>`;
        }

        async function checkFiles() {
            log("Prüfe Dateien...", 'info');
            const basePath = 'assets/markers/painting';
            const exts = ['.fset', '.fset3', '.iset'];
            let errorCount = 0;

            for (let ext of exts) {
                try {
                    let response = await fetch(basePath + ext);
                    if (response.ok) log(`✅ ${ext} OK`, 'success');
                    else { log(`❌ ${ext} FEHLT (404)`, 'error'); errorCount++; }
                } catch (e) { log(`⚠️ ${ext} Fehler`, 'error'); errorCount++; }
            }

            // Video Check
            try {
                let vResp = await fetch('assets/video.mp4');
                if (vResp.ok) log(`✅ Video OK`, 'success');
                else { log(`❌ Video FEHLT`, 'error'); errorCount++; }
            } catch(e) {}

            if (errorCount > 0) {
                log("DATEIEN FEHLEN!", 'error');
                fallbackBtn.style.display = 'block';
            } else {
                log("Alles gefunden. Warte auf AR...", 'success');
                setTimeout(() => { fallbackBtn.style.display = 'block'; }, 4000);
            }
        }

        checkFiles();

        // --- 2. LOGIK ---

        // Marker gefunden
        document.querySelector('a-nft').addEventListener('markerFound', () => {
            loaderScreen.style.display = 'none';
            video.play();
            audio.play();
        });

        // Demo Starten
        window.startDemoMode = function() {
            loaderScreen.style.display = 'none';
            demoVideo.setAttribute('visible', 'true'); // Video an Kamera sichtbar machen

            video.muted = false;
            video.play();
            audio.play();
            alert("Demo läuft (Grüner Hintergrund ist normal!)");
        };

        window.addEventListener('click', () => {
            video.play();
            audio.play();
        });
    </script>
</body>
</html>
